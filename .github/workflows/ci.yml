name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (svelte-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run check
        working-directory: app
      - run: npm run build
        working-directory: app

  backend:
    name: Backend (test + clippy, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      # Standard Tauri v2 Linux build prerequisites — webkit2gtk/gtk3 for the webview, appindicator
      # for the tray icon, librsvg for icon rendering.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential libssl-dev
      # `tauri::generate_context!()` checks at compile time that `frontendDist` (../build)
      # exists, so the frontend has to be built before cargo can compile at all here.
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: cargo test --locked
        working-directory: app/src-tauri
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: app/src-tauri
