name: Build and release

# Builds the Windows installers (NSIS/MSI) and the Linux packages (.deb/.rpm/AppImage) on every
# push to main, and publishes them all to the same new numbered GitHub Release. The release tag
# combines the app's version (from tauri.conf.json) with the run number, e.g. v1.2.0-build.42, so
# it's always unique without needing to commit a version bump back to the repo (which would risk
# retriggering this workflow and needs its own bookkeeping across three files: Cargo.toml,
# tauri.conf.json, package.json).
#
# tauri-action creates/publishes the release itself (rather than a separate softprops step) so
# it can also sign the installers and attach latest.json — that's what the in-app updater
# (tauri-plugin-updater, endpoint `releases/latest/download/latest.json`) fetches to learn a new
# version is out. TAURI_SIGNING_PRIVATE_KEY must be set as a repo secret (see
# updater-key.pem generated by `tauri signer generate`) or the build step fails. Both matrix legs
# publish to the same tagName, so tauri-action appends each platform's bundles to one release
# rather than creating two.
#
# The "Validate updater signing key" step below exists because a malformed secret otherwise fails
# identically on every OS at the very last step of tauri-action — after the full compile and every
# bundle has already been produced (~8-10 minutes gone on each runner for nothing). The single most
# common way to break it: pasting the .key file's two lines into GitHub's secret box loses the
# newline between the "untrusted comment: ..." line and the actual base64 key, collapsing them
# into one line with a space in between — which fails tauri's own base64 decode with something
# like "Invalid symbol 32, offset 9" (32 is the space character). This step reproduces that same
# decode (without ever printing the secret) so a bad key fails in seconds, before anything else
# even starts.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # Never cancel an in-progress release build for main — each one produces its own numbered
  # release, so an earlier run finishing after a later one just means an out-of-order (not
  # wrong) release, unlike a plain CI check where only the latest result matters.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build and release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Validate updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY repository secret is not set. Generate one with 'npx tauri signer generate' and add its contents as a repo secret (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          first_line=$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | head -n1)
          if [[ "$first_line" == "untrusted comment:"* ]]; then
            key_body=$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | tail -n +2)
          else
            key_body="$TAURI_SIGNING_PRIVATE_KEY"
          fi
          if [ -z "$key_body" ] || ! printf '%s' "$key_body" | base64 -d > /dev/null 2>&1; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY doesn't decode as a valid signing key. The most common cause: the secret was pasted with the newline between the 'untrusted comment: ...' line and the base64 key collapsed into a space. Re-copy the exact, full contents of the .key file 'tauri signer generate' produced (both lines, newline intact) into the repo secret."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      # Standard Tauri v2 Linux build prerequisites, plus `rpm-build`/`file` so the bundler can
      # actually produce the `.rpm` (Fedora-compatible) package alongside the `.deb`/AppImage.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential libssl-dev rpm file

      - run: npm ci
        working-directory: app

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: app
          tagName: v${{ steps.app_version.outputs.version }}-build.${{ github.run_number }}
          releaseName: v${{ steps.app_version.outputs.version }} (build ${{ github.run_number }})
          releaseCommitish: ${{ github.sha }}
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows build artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: longbow-windows-${{ github.sha }}
          path: |
            app/src-tauri/target/release/app.exe
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Upload Linux build artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: longbow-linux-${{ github.sha }}
          path: |
            app/src-tauri/target/release/bundle/rpm/*.rpm
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30
