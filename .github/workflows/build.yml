name: Build app

# Builds the Windows NSIS/MSI installers + raw exe, and the Linux .deb/.rpm/AppImage, on every
# push to main, and publishes them together as a new numbered GitHub Release each time. The
# release tag combines the app's version (from tauri.conf.json) with the run number, e.g.
# v1.2.0-build.42, so it's always unique without needing to commit a version bump back to the
# repo (which would risk retriggering this workflow and needs its own bookkeeping across three
# files: Cargo.toml, tauri.conf.json, package.json).
#
# tauri-action creates/publishes the release itself (rather than a separate softprops step) so
# it can also sign the installers and attach latest.json — that's what the in-app updater
# (tauri-plugin-updater, endpoint `releases/latest/download/latest.json`) fetches to learn a new
# version is out. TAURI_SIGNING_PRIVATE_KEY must be set as a repo secret (see
# updater-key.pem generated by `tauri signer generate`) or the build step fails. Both matrix legs
# publish into the same release (same tagName), so one push produces one release carrying every
# platform's artifacts.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # Never cancel an in-progress release build for main — each one produces its own numbered
  # release, so an earlier run finishing after a later one just means an out-of-order (not
  # wrong) release, unlike a plain CI check where only the latest result matters.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build and release (${{ matrix.platform }})
    strategy:
      # One platform failing shouldn't cancel the other's build — they publish independently
      # into the same release, so a Windows-only or Linux-only success is still worth keeping.
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          # 22.04 rather than -latest: an older glibc baseline keeps the AppImage runnable on
          # other distros (e.g. Arch), which generally ship newer glibc than they build against.
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install Tauri Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev libxdo-dev rpm

      - run: npm ci
        working-directory: app

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: app
          tagName: v${{ steps.app_version.outputs.version }}-build.${{ github.run_number }}
          releaseName: v${{ steps.app_version.outputs.version }} (build ${{ github.run_number }})
          releaseCommitish: ${{ github.sha }}
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows build artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: longbow-windows-${{ github.sha }}
          path: |
            app/src-tauri/target/release/app.exe
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Upload Linux build artifacts
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: longbow-linux-${{ github.sha }}
          path: |
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/rpm/*.rpm
            app/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30
